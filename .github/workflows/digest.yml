name: Digest

on:
  schedule:
    # UTC. 13:00 UTC = 8am ET / 5am PT. Adjust to your timezone.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # manual trigger, useful for the first test run

# Only needed if you enable the "Archive" step below.
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # digest.yaml is gitignored so your personal config never lands in a
      # public repo. Store it as a repo secret (paste the whole file) and
      # write it out here. If you'd rather commit it, delete this step and
      # remove `digest.yaml` from .gitignore.
      - name: Write config
        run: printf '%s' "$DIGEST_CONFIG" > digest.yaml
        env:
          DIGEST_CONFIG: ${{ secrets.DIGEST_CONFIG }}

      - name: Run digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_WEBHOOK_URL: ${{ secrets.DIGEST_WEBHOOK_URL }}
        run: python main.py

      # Optional: keep every day's JSON in the repo as a free archive.
      # Off by default — in a public repo it publishes your reading history.
      # - name: Archive
      #   run: |
      #     git config user.name "digest-bot"
      #     git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      #     git add -f data/*.json
      #     git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
      #     git push
